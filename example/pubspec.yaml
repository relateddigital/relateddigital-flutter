name: relateddigital_flutter_example
description: Demonstrates how to use the relateddigital_flutter plugin.
version: 1.0.0+1

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:

  flutter:
    sdk: flutter

  shared_preferences: ^2.0.9
  cupertino_icons: ^1.0.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  relateddigital_flutter:
    path: ../



dev_dependencies:
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true
